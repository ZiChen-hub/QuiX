// QuiX ZeroTier embedded-core native library module.
// Compiles the official ZeroTierOne core (third_party/ZeroTierOne, BSL 1.1)
// into libZeroTierOneJNI.so for Android via NDK + CMake.

apply plugin: 'com.android.library'

android {
    namespace 'com.quix.zerotiercore'
    compileSdk 36
    ndkVersion "27.0.12077973"

    buildFeatures {
        buildConfig true
        aidl true
    }

    defaultConfig {
        minSdk 21

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "cmake/CMakeLists.txt"
        }
    }
}

// Fix AIDL-generated Java files: replace non-ASCII user path with ASCII
// to avoid "unmappable character for encoding UTF-8" on Windows with
// non-English user profile directory.
tasks.whenTaskAdded { task ->
    if (task.name == 'compileDebugJavaWithJavac' || task.name == 'compileReleaseJavaWithJavac') {
        task.doFirst {
            def aidlDir = new File(buildDir, "generated/aidl_source_output_dir")
            aidlDir.eachFileRecurse { file ->
                if (file.name.endsWith('.java')) {
                    def text = file.getText('UTF-8')
                    // Replace any non-ASCII characters in comment lines with '?'
                    def fixed = text.readLines().collect { line ->
                        if (line.startsWith(' *') || line.startsWith('/*') || line.startsWith('//')) {
                            line.replaceAll(/[^\x00-\x7F]/, '?')
                        } else {
                            line
                        }
                    }.join('\n')
                    file.setText(fixed, 'UTF-8')
                }
            }
        }
    }
}
